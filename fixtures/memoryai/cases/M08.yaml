external_id: M08
purpose: A candidate assertion rejected by the reviewer never becomes accepted evidence.
severity: critical
cluster_id: synthetic-person-08
split: test
tags: {language: en, temporal_update: false, negation: false, lifecycle: review}
episode:
  - {id: c1, action: assert, args: {text: "The user is allergic to peanuts.", status: candidate}}
  - {id: x1, action: reject, args: {step: c1}}
  - {id: s1, action: inspect_state}
  - {id: r1, action: recall, args: {query: "Am I allergic to anything?", level: mid, budget: 400}}
  - {id: a1, action: generate, args: {question: "Am I allergic to anything?", context_ref: r1.context}}
expected:
  forbidden_current_facts:
    - subject: user
      relation: allergy
      object: peanuts
      match: {any: [peanut]}
  answer_must_not_contain: [peanut]
  invariants: [no_rejected_fact_as_accepted]
  evidence_steps: [c1, x1, s1]
evidence:
  - {step: x1, role: rejection}
